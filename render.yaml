# ============================================================
# render.yaml — Render.com Blueprint
# Ավտոմատ ստեղծում է web service + PostgreSQL database
# ============================================================
databases:
  - name: gasstation-db
    databaseName: gasstationms
    user: gasstation
    plan: free

services:
  - type: web
    name: gasstation-ms
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gasstation-db
          property: connectionString
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
